<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="check-interval" content="{{.CheckInterval}}">
    <meta name="endpoint-prefix" content="{{.EndpointPrefix}}">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/{{.EndpointPrefix}}/static/loading.css">
</head>
<body>
    <div class="container">
        {{.IndicatorHTML}}
        <h1>{{.Heading}}</h1>
        <p>{{.Message}}</p>
        <div class="status">{{.Status}}</div>
    </div>
    <script src="/{{.EndpointPrefix}}/static/loading.js"></script>
</body>
</html>
